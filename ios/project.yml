# XcodeGen spec — the single source of truth for the Xcode project.
# IBlocker.xcodeproj is generated from this file and is not committed:
#
#   cd ios && xcodegen generate
#
# Signing: DEVELOPMENT_TEAM and BUNDLE_ID_PREFIX below are the only values
# you need to change. Bundle IDs and the App Group derive from the prefix;
# the Info.plists and .entitlements files reference $(APP_GROUP_ID), so
# nothing else hardcodes an identifier.

name: IBlocker

options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  IBlockerKit:
    path: IBlockerKit

settings:
  base:
    # Apple developer account
    DEVELOPMENT_TEAM: QEZ63CXN26
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    BUNDLE_ID_PREFIX: net.renalias
    APP_GROUP_ID: group.net.renalias.adblocker

    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 4
    TARGETED_DEVICE_FAMILY: "1,2"

    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Release:
      VALIDATE_PRODUCT: YES

targets:
  IBlocker:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).adblocker
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/IBlocker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: IBlockerKit
        products: [IBlockerKit, IBlockerUI]
      - target: PacketTunnel
      - target: ContentBlocker
      - target: IBlockerWidgets

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).adblocker.tunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: IBlockerKit
        products: [IBlockerKit, IBlockerTunnelKit]

  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: ContentBlocker
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).adblocker.blocker
        INFOPLIST_FILE: ContentBlocker/Info.plist
        CODE_SIGN_ENTITLEMENTS: ContentBlocker/ContentBlocker.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: IBlockerKit
        products: [IBlockerKit]

  IBlockerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).adblocker.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/IBlockerWidgets.entitlements
    dependencies:
      - package: IBlockerKit
        products: [IBlockerKit]

schemes:
  IBlocker:
    build:
      targets:
        IBlocker: all
    run:
      config: Debug
    archive:
      config: Release
