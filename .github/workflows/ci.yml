name: CI

on:
  push:
  pull_request:

jobs:
  test-macos:
    name: swift test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          swift --version
      - name: Run package tests
        run: swift test --package-path ios/IBlockerKit

  build-ios:
    name: xcodebuild (iOS app, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: List targets and schemes
        run: xcodebuild -list -project ios/IBlocker.xcodeproj
      - name: Build app + extensions
        run: >
          xcodebuild build
          -project ios/IBlocker.xcodeproj
          -scheme IBlocker
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGN_IDENTITY=""
          DEVELOPMENT_TEAM=""

